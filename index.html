<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キーワード検索</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        input[type="text"] {
            width: calc(100% - 110px);
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        .settings-container {
            margin-top: 50px; /* 他の表示から3行空けるためのmargin-top */
        }
        .settings-button {
            background-color: #808080; /* グレー */
        }
        .settings-options {
            display: none;
            margin-top: 10px;
        }
        .settings-options button {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <form id="searchForm">
            <input type="text" id="keywordInput" placeholder="キーワードを入力">
            <button type="submit">検索</button>
            <select id="keywordHistory">
                <option value="" disabled selected>キーワード履歴から選択</option>
            </select>
        </form>

        <div class="settings-container">
            <button id="settingsButton" class="settings-button">設定</button>
            <div id="settingsOptions" class="settings-options">
                <button id="exportButton" type="button">履歴をエクスポート</button>
                <input type="file" id="importFile" accept="text/plain" style="display: none;">
                <button id="importButton" type="button">履歴をインポート</button>
                <button id="clearHistoryButton" type="button">履歴を削除</button>
            </div>
        </div>
    </div>

    <script>
        const keywordInput = document.getElementById('keywordInput');
        const searchForm = document.getElementById('searchForm');
        const keywordHistorySelect = document.getElementById('keywordHistory');
        const settingsButton = document.getElementById('settingsButton');
        const settingsOptions = document.getElementById('settingsOptions');
        const exportButton = document.getElementById('exportButton');
        const importButton = document.getElementById('importButton');
        const clearHistoryButton = document.getElementById('clearHistoryButton');
        const importFile = document.getElementById('importFile');

        const HISTORY_KEY = 'searchKeywords';
        const MAX_HISTORY_LENGTH = 50;
        let keywordHistory = loadHistory();

        function loadHistory() {
            const storedHistory = localStorage.getItem(HISTORY_KEY);
            return storedHistory ? JSON.parse(storedHistory) : [];
        }

        function saveHistory() {
            localStorage.setItem(HISTORY_KEY, JSON.stringify(keywordHistory));
            updateHistoryDropdown();
        }

        function addKeywordToHistory(keyword) {
            if (keyword && !keywordHistory.includes(keyword)) {
                keywordHistory.unshift(keyword);
                if (keywordHistory.length > MAX_HISTORY_LENGTH) {
                    keywordHistory.pop();
                }
                saveHistory();
            }
        }

        function updateHistoryDropdown() {
            keywordHistorySelect.innerHTML = '<option value="" disabled selected>キーワード履歴から選択</option>';
            keywordHistory.forEach(keyword => {
                const option = document.createElement('option');
                option.value = keyword;
                option.textContent = keyword;
                keywordHistorySelect.appendChild(option);
            });
        }

        function moveKeywordToTop(keyword) {
            const index = keywordHistory.indexOf(keyword);
            if (index > -1) {
                keywordHistory.splice(index, 1);
                keywordHistory.unshift(keyword);
                saveHistory();
            }
        }

        function clearKeywordHistory() {
            keywordHistory = [];
            saveHistory();
        }

        searchForm.addEventListener('submit', function(event) {
            event.preventDefault();
            const keyword = keywordInput.value.trim();
            if (keyword) {
                addKeywordToHistory(keyword);
                window.location.href = `http://192.168.4.101/search/searchresult/searchresult.html?keyword=${encodeURIComponent(keyword)}`;
                keywordInput.value = '';
            }
        });

        keywordHistorySelect.addEventListener('change', function() {
            const selectedKeyword = this.value;
            if (selectedKeyword) {
                moveKeywordToTop(selectedKeyword);
                window.location.href = `http://192.168.4.101/search/searchresult/searchresult.html?keyword=${encodeURIComponent(selectedKeyword)}`;
            }
            this.selectedIndex = 0; // 選択状態をリセット
        });

        settingsButton.addEventListener('click', function() {
            settingsOptions.style.display = settingsOptions.style.display === 'none' ? 'block' : 'none';
        });

        exportButton.addEventListener('click', function() {
            const historyText = keywordHistory.join('\n');
            const blob = new Blob([historyText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'keyword_history.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        importButton.addEventListener('click', function() {
            importFile.click();
        });

        importFile.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const importedKeywords = e.target.result.split('\n').map(keyword => keyword.trim()).filter(keyword => keyword !== '');
                    importedKeywords.forEach(keyword => {
                        if (!keywordHistory.includes(keyword)) {
                            keywordHistory.unshift(keyword);
                            if (keywordHistory.length > MAX_HISTORY_LENGTH) {
                                keywordHistory.pop();
                            }
                        }
                    });
                    saveHistory();
                    importFile.value = ''; // ファイル選択をリセット
                };
                reader.readAsText(file);
            }
        });

        clearHistoryButton.addEventListener('click', function() {
            if (confirm('キーワード履歴をすべて削除しますか？')) {
                clearKeywordHistory();
            }
        });

        // 初回読み込み時に履歴を更新
        updateHistoryDropdown();
    </script>
</body>
</html>
