<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キーワード検索</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 600px;
        }

        .search-form {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-form input[type="text"] {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .search-form button[type="submit"] {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .history-select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        /* レスポンシブデザイン */
        @media (max-width: 600px) {
            .search-form {
                flex-direction: column;
            }

            .search-form button[type="submit"] {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <form class="search-form" id="searchForm" action="http://192.168.4.101/search/searchresult/searchresult.html" method="get">
            <input type="text" id="keywordInput" name="keyword" placeholder="キーワードを入力">
            <button type="submit">検索</button>
        </form>

        <select class="history-select" id="keywordHistory">
            <option value="" disabled selected>過去のキーワードを選択</option>
        </select>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const keywordInput = document.getElementById('keywordInput');
            const searchForm = document.getElementById('searchForm');
            const keywordHistorySelect = document.getElementById('keywordHistory');
            const maxHistorySize = 50;
            let keywordHistory = loadKeywordHistory();

            // ローカルストレージからキーワード履歴を読み込む
            function loadKeywordHistory() {
                const storedHistory = localStorage.getItem('keywordHistory');
                return storedHistory ? JSON.parse(storedHistory) : [];
            }

            // ローカルストレージにキーワード履歴を保存する
            function saveKeywordHistory() {
                localStorage.setItem('keywordHistory', JSON.stringify(keywordHistory));
            }

            // キーワード履歴をリストに表示する（最新のものを上に）
            function updateKeywordHistoryList() {
                keywordHistorySelect.innerHTML = '<option value="" disabled selected>過去のキーワードを選択</option>';
                // 最新のものを先頭にするためにreverseしてからoptionを追加
                [...keywordHistory].reverse().forEach(keyword => {
                    const option = document.createElement('option');
                    option.value = keyword;
                    option.textContent = keyword;
                    keywordHistorySelect.appendChild(option);
                });
            }

            // フォーム送信時の処理
            searchForm.addEventListener('submit', function(event) {
                const currentKeyword = keywordInput.value.trim();
                if (currentKeyword) {
                    // 重複を排除して履歴に追加（最新のものを先頭にする）
                    const index = keywordHistory.indexOf(currentKeyword);
                    if (index !== -1) {
                        keywordHistory.splice(index, 1); // 既存のものを削除
                    }
                    keywordHistory.push(currentKeyword);
                    if (keywordHistory.length > maxHistorySize) {
                        keywordHistory.shift(); // 古いキーワードを削除
                    }
                    saveKeywordHistory();
                    updateKeywordHistoryList();

                    // フォームのaction属性にキーワードを追加
                    this.action = `http://192.168.4.101/search/searchresult/searchresult.html?keyword=${encodeURIComponent(currentKeyword)}`;
                } else {
                    event.preventDefault(); // キーワードが空の場合は送信しない (必要に応じて)
                }
            });

            // 履歴から選択されたキーワードを入力欄に設定
            keywordHistorySelect.addEventListener('change', function() {
                keywordInput.value = this.value;
            });

            // 初回読み込み時に履歴を表示
            updateKeywordHistoryList();
        });
    </script>
</body>
</html>
