<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regzaキーワード検索</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        input[type="text"], select, button {
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-size: 16px;
        }
        input[type="text"] {
            width: 100%;
        }
        select {
            width: 100%;
        }
        button {
            background-color: #f0f0f0;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #e0e0e0;
        }
        .button-group {
            display: flex;
            gap: 10px;
        }
        .settings-group {
            margin-top: 10px;
            display: none; /* 初期状態では非表示 */
            flex-direction: column;
            gap: 10px;
        }
        .settings-button {
            background-color: #f0f0f0;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .settings-button:hover {
            background-color: #e0e0e0;
        }
        .settings-link {
            display: block;
            margin-top: 30px;
            color: blue;
            text-decoration: underline;
            cursor: pointer;
        }
        #importFile {
            display: none; /* ファイル選択inputを非表示 */
        }
    </style>
</head>
<body>
    <div class="container">
        <form id="searchForm" action="http://192.168.4.101/search/searchresult/searchresult.html" method="get">
            <input type="text" id="keyword" name="keyword" placeholder="キーワードを入力">
            <select id="keywordHistory" onchange="submitForm(this)">
                <option value="" hidden>キーワード選択</option>
            </select>
            <div class="button-group">
                <button type="button" onclick="searchRegza()">レグザ検索</button>
                <button type="button" onclick="searchTVDetuzo()">TVでた蔵検索</button>
            </div>
        </form>

        <div class="settings-link" onclick="toggleSettings()">設定</div>

        <div id="settings" class="settings-group">
            <button class="settings-button" onclick="exportHistory()">エキスポートを実行</button>
            <button class="settings-button" onclick="triggerImport()">インポートを実行</button>
            <input type="file" id="importFile" accept="text/plain" onchange="importHistory()">
            <button class="settings-button" onclick="clearHistory()">キーワード履歴を削除</button>
        </div>
    </div>

    <script>
        const searchForm = document.getElementById('searchForm');
        const keywordInput = document.getElementById('keyword');
        const keywordHistorySelect = document.getElementById('keywordHistory');
        const settingsDiv = document.getElementById('settings');
        const importFileElement = document.getElementById('importFile');

        let keywords = loadKeywords();
        updateKeywordHistory();

        function loadKeywords() {
            const storedKeywords = localStorage.getItem('keywords');
            return storedKeywords ? JSON.parse(storedKeywords) : [];
        }

        function saveKeywords() {
            localStorage.setItem('keywords', JSON.stringify(keywords));
        }

        function addKeyword(keyword) {
            if (keyword && keyword.trim() !== "") {
                const trimmedKeyword = keyword.trim();
                const index = keywords.indexOf(trimmedKeyword);
                if (index > -1) {
                    keywords.splice(index, 1); // 重複を削除
                }
                keywords.unshift(trimmedKeyword); // 先頭に追加
                if (keywords.length > 50) {
                    keywords.pop(); // 最大50件まで
                }
                saveKeywords();
                updateKeywordHistory();
            }
        }

        function updateKeywordHistory() {
            keywordHistorySelect.innerHTML = '';
            const defaultOption = document.createElement('option');
            defaultOption.value = '';
            defaultOption.textContent = 'キーワード選択';
            defaultOption.hidden = true; // 初期表示を非表示にする
            keywordHistorySelect.appendChild(defaultOption);
            keywords.forEach(keyword => {
                const option = document.createElement('option');
                option.value = keyword;
                option.textContent = keyword;
                keywordHistorySelect.appendChild(option);
            });
        }

        function submitForm(selectElement) {
            const selectedKeyword = selectElement.value;
            if (selectedKeyword !== "") {
                keywordInput.value = selectedKeyword;
                addKeyword(selectedKeyword); // 選択したキーワードを先頭に移動
                searchForm.submit(); // フォームを送信
            }
        }

        keywordInput.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                searchRegza(); // デフォルトはレグザ検索とするか、必要に応じて変更
            }
        });

        function searchRegza() {
            const keyword = keywordInput.value;
            addKeyword(keyword);
            searchForm.submit();
        }

        function searchTVDetuzo() {
            const keyword = keywordInput.value;
            window.location.href = `https://www.google.com/search?num=50&tbs=qdr:m&sbd:1&q=site%3Ahttps%3A%2F%2Fdatazoo.jp%2F+${encodeURIComponent(keyword)}`;
            // TVでた蔵検索ではキーワード履歴に追加しない
        }

        function exportHistory() {
            const text = keywords.join('\n');
            const filename = 'keyword_history.txt';
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            alert('キーワード履歴をエクスポートしました。');
        }

        function triggerImport() {
            importFileElement.click(); // 非表示のファイル選択inputをクリック
        }

        function importHistory() {
            const file = importFileElement.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const importedKeywords = e.target.result.split('\n').filter(keyword => keyword.trim() !== "");
                    keywords = [...new Set([...importedKeywords, ...keywords])].slice(0, 50); // 重複排除して最大50件
                    saveKeywords();
                    updateKeywordHistory();
                    alert('キーワード履歴をインポートしました。');
                };
                reader.readAsText(file);
            } else {
                alert('ファイルを選択してください。');
            }
        }

        function clearHistory() {
            if (confirm('キーワード履歴を削除しますか？')) {
                keywords = [];
                saveKeywords();
                updateKeywordHistory();
                alert('キーワード履歴を削除しました。');
            }
        }

        function toggleSettings() {
            settingsDiv.style.display = settingsDiv.style.display === 'none' ? 'flex' : 'none';
        }
    </script>
</body>
</html>
